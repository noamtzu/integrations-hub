# Local Postgres for development and integration tests.
#   docker compose up -d
#   DATABASE_URL=postgres://hub:hub@localhost:5433/hub
#   TEST_DATABASE_URL=postgres://hub:hub@localhost:5433/hub_test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
